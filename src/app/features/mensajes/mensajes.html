<section id="mensajes" class="section-full mensajes-bg">
  <div class="section">
    <div class="section-label">🔒 CONTINGUT SECRET</div>


    <!-- Gift -->
    @if (!giftWatched()) {
      <div class="gift-wrap">
        <p class="gift-hint font-mono">✨ OBRIR EL REGAL FENT CLICK ✨</p>
        <button class="gift-btn" (click)="openGift()" aria-label="Obrir regal">🎁</button>
      </div>
    }
    <!-- Second gift (visible only after first video ends) -->
    @if (giftWatched()) {
      <div class="gift-wrap">
        <p class="gift-hint gift-hint-blue font-mono gift-hint-reveal">🎁 SEMBLA QUE TENS UN ALTRE REGAL... 🎁</p>
        <button class="gift-btn gift-btn-blue gift-drop" (click)="openCongrats()" aria-label="Obrir segon regal">🎁</button>
      </div>
    }


  </div>
</section>
